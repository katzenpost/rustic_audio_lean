[package]
name = "rustic_audio_lean"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "rustic_audio_lean"
crate-type = ["staticlib"]

[dependencies]
lean-sys = { git = "https://github.com/katzenpost/lean-sys", rev = "7b998184a82d6a6ddcc7626abf5eaac2e5345244", package = "katzenpost-lean-sys", default-features = false, features = ["mimalloc"] }
rustic_audio = { git = "https://github.com/katzenpost/rustic_audio", rev = "533a72647143ecbbf22038dcab82ad3cc2ae537b" }

[profile.release]
panic = "abort"
