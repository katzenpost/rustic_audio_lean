[package]
name = "rustic_audio_lean"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "rustic_audio_lean"
crate-type = ["staticlib"]

[dependencies]
lean-sys = { git = "https://github.com/katzenpost/lean-sys", rev = "ac11ff152cc82bccd0ef18f45384ac5acb091260", default-features = false, features = ["mimalloc"] }
rustic_audio = { git = "https://github.com/katzenpost/rustic_audio", rev = "6f7969d03a201406beb1f5aa6cfbf70567abc435" }

[patch.crates-io]
opus-rs = { git = "https://github.com/katzenpost/rustic_audio", rev = "6f7969d03a201406beb1f5aa6cfbf70567abc435" }

[profile.release]
panic = "abort"
