name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELAN_VERSION: 4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: install elan
        run: |
          curl -fsSLO "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf elan-x86_64-unknown-linux-gnu.tar.gz
          ./elan-init -y --default-toolchain "$(cat lean-toolchain)" --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lean-sys is built for our toolchain
        run: |
          dir=$(cd rust && cargo metadata --locked --format-version 1 |
            jq -r '.packages[] | select(.name == "katzenpost-lean-sys") | .manifest_path' | xargs dirname)
          echo "katzenpost-lean-sys: $(cat "$dir/lean-toolchain"), ours: $(cat lean-toolchain)"
          [ "$(cat "$dir/lean-toolchain")" = "$(cat lean-toolchain)" ]
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust
      # With no sound card on the runner, ALSA's null device plays and records silence.
      - name: lake exe audio-test
        run: |
          printf 'pcm.!default { type null }\nctl.!default { type hw card 0 }\n' > "$RUNNER_TEMP/null.conf"
          lake build audio-test
          ALSA_CONFIG_PATH="$RUNNER_TEMP/null.conf" lake exe audio-test
      - name: build for Android phones
        run: |
          rustup target add aarch64-linux-android
          cargo install --locked cargo-ndk@4.1.2
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 28 build --release
        working-directory: rust
